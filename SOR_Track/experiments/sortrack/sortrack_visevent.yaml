# experiments/ceutrack/ceutrack_visevent.yaml
# 原 CEUTrack 
DATA:
  MAX_SAMPLE_INTERVAL: 100
  MEAN: [0.485, 0.456, 0.406]
  STD:  [0.229, 0.224, 0.225]
  EVENT_MEAN: [0.0346, 0.0000, 0.0549]
  EVENT_STD:  [0.1569, 0.0000006, 0.1832]
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 1       
  TRAIN:
    DATASETS_NAME: [VisEvent]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 60000
  VAL:
    DATASETS_NAME: [VisEvent_VAL]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 5000

MODEL:
  ARCH_MODE: "base"
  PRETRAIN_FILE: "mae_pretrain_ep0300.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False

  BACKBONE:
    TYPE: vit_base_patch16_224_ce
    STRIDE: 16                      # base 模式：PatchEmbed stride=16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [1, 1, 1]
    CE_TEMPLATE_RANGE: 'CTR_POINT'

  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  CE_START_EPOCH: 0
  CE_WARM_EPOCH: 0
  BATCH_SIZE: 32
  EPOCH: 50
  GIOU_WEIGHT: 1
  L1_WEIGHT: 14
  FOCAL_WEIGHT: 1.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 40
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 100
  SCHEDULER:
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 5
  WEIGHT_DECAY: 0.0001
  AMP: False

TEST:
  EPOCH: 40
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  EVENT_NORM_MODE: "event" 