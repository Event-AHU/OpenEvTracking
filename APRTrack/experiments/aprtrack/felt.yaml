DATA:
  MAX_SAMPLE_INTERVAL: 200
  SAMPLER_MODE: 'causal'
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  STD:
  - 0.229
  - 0.224
  - 0.225
  SEARCH:
    CENTER_JITTER: 3.5
    FACTOR: 4.0
    SCALE_JITTER: 0.5
    SIZE: 256
    NUMBER: 3
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 2
  TRAIN:
    DATASETS_NAME:
    - FELT
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 30000
  VAL:
    DATASETS_NAME:
    - FELT_VAL
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 10000
MODEL:
  PRETRAIN_PATH: "./pretrained_networks"
  PRETRAIN_FILE: "mae_hivit_base_1600ep.pth"
  APG:
    ENABLE: True
    WARMUP_EPOCHS: 10
    MODAL_ENABLE: True
    SPATIAL_ENABLE: True
    MODAL_BALANCE_WEIGHT: 0.1
    MODAL_TARGET_PROBS: [0.2, 0.4, 0.4]
    SPATIAL_MASK_RATIO_MIN: 0.15
    SPATIAL_MASK_RATIO_MAX: 0.30
    SPATIAL_TEMPERATURE: 1.0
    SPATIAL_ANCHOR_OVERLAP_THRESHOLD: 0.45
    SPATIAL_ANCHOR_PENALTY_WEIGHT: 0.5
    ROUTE_PROBS: [0.4, 0.3, 0.3]
    ROUTE_COMPLETION: [False, False, True]
  COMPLETION:
    ENABLE: True
    MEMORY_SIZE: 5
    NUM_HEADS: 4
    DROPOUT: 0.1
    GATE_INIT_VALUE: -1.0
  BACKBONE:
    TYPE: hivit_base
    STRIDE: 16
    ATTN_DROP_RATE: 0.0
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  BATCH_SIZE: 16
  EPOCH: 50
  LR_DROP_EPOCH: 40
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  FOCAL_WEIGHT: 1.0
  LR: 0.0001
  GRAD_CLIP_NORM: 0.1
  NUM_WORKER: 8
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 5
  WEIGHT_DECAY: 0.0001
  AMP: False
TEST:
  EPOCH: 50
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  UPDATE_INTERVAL: 25
  UPDATE_THRESHOLD: 0.70
